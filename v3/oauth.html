<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>SoundWich APP の確認</title>
<style>
  html,body{margin:0;height:100%;background:#1c1c1e;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
  .box{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
  .box img{width:64px;height:64px;border-radius:14px}
  .box p{margin:0;font-size:15px;line-height:1.7;max-width:320px}
  .box .sub{font-size:13px;color:#8e8e93}
  .box .ng{color:#ff6b6b}
  .box button{font:inherit;font-size:15px;font-weight:600;background:#0a84ff;color:#fff;border:0;border-radius:10px;padding:10px 22px;cursor:pointer}
</style>
</head>
<body>
<div class="box"><img src="../apple-touch-icon.png" alt=""><p id="m">確かめています…</p><p class="sub" id="s"></p><button id="b" style="display:none">閉じる</button></div>
<script>
  // ［そうする］をご本人のGoogleアカウントで書くための窓（2026-11-20 天田さん「押した人の名前で残す仕組みがいいよ」）。
  // アプリが開いたこの窓で、Googleの許可（スプレッドシート・メールアドレス）を取り、その人の一時的な鍵（1時間で切れる）と整理券をアプリへ送る。
  // 鍵はこの端末に1時間だけ取っておき、続けて押したときは許可の画面を出さずに使う。アプリ（Web.gs の otkUse_）が鍵の持ち主と宛先を確かめてから書く
  const EXEC = 'https://script.google.com/macros/s/AKfycbxSB-wZdgOUeokFqoIKT4RjKyN3-roupbiJlbRINV0bdzMdXbmB8L8fuChSce2Jrvnd/exec';
  const CLIENT = '39750626073-pih0kjhv4ukj87lh6fhbqha1npug2ah8.apps.googleusercontent.com';
  const SCOPES = { '': 'https://www.googleapis.com/auth/spreadsheets email', meet: 'https://www.googleapis.com/auth/meetings.space.created email', cal: 'https://www.googleapis.com/auth/calendar.events email' }; // meet＝本人のアカウントでMeetを作る（2026-11-20）／cal＝本人のカレンダーに予定とMeetを作る（2026-11-24）
  // keep＝長く使える鍵（refresh token）をもらう形（2026-11-27 天田さん「2がいい」）。許可はスプレッドシートとメールアドレスだけ。引き換え券（code）をアプリへ送り、アプリが鍵に換えて覚える。次からは窓を出さずに本人の名前で書く
  const KEEP_SCOPE = 'openid email https://www.googleapis.com/auth/spreadsheets';
  const ME = location.origin + location.pathname;
  const $ = id => document.getElementById(id);
  const say = (m, s, bad) => { $('m').textContent = m; $('m').className = bad ? 'ng' : ''; $('s').textContent = s || ''; };
  const done = () => { $('b').style.display = ''; $('b').onclick = () => window.close(); };
  const keyOf = (mail, sc) => 'swapp.otk.' + (sc ? sc + '.' : '') + String(mail || '').toLowerCase();
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  history.replaceState(null, '', location.pathname); // 鍵・引き換え券をアドレスに残さない
  function send(tk, token, err, code) {
    say(err ? '取りやめました' : '書いています…', err ? '' : 'この窓は閉じてもかまいません（書き込みは続きます）', !!err);
    fetch(EXEC, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'v2otk', tk, token: token || '', err: err || '', code: code || '' }) })
      .then(() => { if (!err) { say('送りました', 'アプリの画面に結果が出ます。この窓を閉じます'); setTimeout(() => window.close(), 1500); } done(); })
      .catch(() => { say('送れませんでした', '通信が切れたかもしれません。アプリでもう一度押してください', true); done(); });
  }
  // スプレッドシートの許可が入っているか（Googleの許可の画面では、項目ごとのチェックを外せる。外すと鍵はできるが書けない）
  const hasSheets = (s, sc) => sc === 'cal' ? /auth\/calendar\.events/.test(String(s || '')) : sc === 'meet' ? /meetings\.space\.created/.test(String(s || '')) : /\/auth\/spreadsheets(\s|$)/.test(String(s || '')); // Meetのときは、Meetを作る許可があるか
  // again＝true：もう一度、許可の画面を必ず出す（チェックを入れ直してもらうため）
  // silent＝true：まず許可の画面を出さずに鍵をもらう（prompt=none）。許可がすでにあれば、画面は出ずに戻ってくる。画面が要るときだけ、普通の許可に切り替える（2026-11-24 天田さん「梅木さんの許可が何回かに一回出る」）
  const toGoogle = (tk, mail, again, sc, silent, keep) => {
    say('Googleに移ります…', mail ? mail + ' で確かめます' : '');
    const u = new URL('https://accounts.google.com/o/oauth2/v2/auth');
    if (keep) { // 長く使える鍵：毎回「許可」の画面を出して引き換え券をもらう（Googleは許可の画面を通ったときだけ長く使える鍵をくれる）
      u.searchParams.set('client_id', CLIENT); u.searchParams.set('redirect_uri', ME); u.searchParams.set('response_type', 'code');
      u.searchParams.set('scope', KEEP_SCOPE); u.searchParams.set('access_type', 'offline'); u.searchParams.set('prompt', 'consent'); u.searchParams.set('state', tk + '|' + mail + '||k');
      if (mail) u.searchParams.set('login_hint', mail);
      location.replace(u.toString()); return;
    }
    u.searchParams.set('client_id', CLIENT); u.searchParams.set('redirect_uri', ME); u.searchParams.set('response_type', 'token');
    u.searchParams.set('scope', SCOPES[sc || '']); u.searchParams.set('include_granted_scopes', 'true'); u.searchParams.set('state', tk + '|' + mail + '|' + (sc || '') + (silent && !again ? '|n' : ''));
    if (mail) u.searchParams.set('login_hint', mail);
    if (again) u.searchParams.set('prompt', 'consent'); else if (silent) u.searchParams.set('prompt', 'none');
    location.replace(u.toString());
  };
  if (q.get('code') || (q.get('error') && q.get('state'))) {
    // 長く使える鍵の形で戻ってきた（引き換え券は ?code= に付いてくる）
    const st = String(q.get('state') || '').split('|'), tk = st[0] || '', mail = st[1] || '';
    if (!/^[0-9a-f]{40}$/.test(tk)) { say('整理券が読めませんでした', 'アプリでもう一度押してください', true); done(); }
    else if (q.get('error')) send(tk, '', q.get('error') === 'access_denied' ? '許可されませんでした' : q.get('error'));
    else if (q.get('scope') && !hasSheets(q.get('scope'), '')) {
      say('スプレッドシートの許可にチェックが入っていませんでした', '下のボタンでGoogleの画面をもう一度開き、「Google スプレッドシート」の行にチェックを入れて「続行」を押してください（まだ書いていません）', true);
      $('b').textContent = 'もう一度Googleへ'; $('b').style.display = ''; $('b').onclick = () => toGoogle(tk, mail, true, '', false, true);
    }
    else send(tk, '', '', q.get('code'));
  } else if (h.get('access_token') || h.get('error')) {
    // Googleから戻ってきた
    const st = String(h.get('state') || '').split('|'), tk = st[0] || '', mail = st[1] || '', sc = SCOPES[st[2]] ? st[2] || '' : '';
    if (!/^[0-9a-f]{40}$/.test(tk)) { say('整理券が読めませんでした', 'アプリでもう一度押してください', true); done(); }
    else if (h.get('error') && st[3] === 'n' && /login_required|consent_required|interaction_required|account_selection_required/.test(h.get('error'))) toGoogle(tk, mail, false, sc, false); // 静かに取れなかった：普通の許可の画面へ
    else if (h.get('error')) send(tk, '', h.get('error') === 'access_denied' ? '許可されませんでした' : h.get('error'));
    else if (h.get('scope') && !hasSheets(h.get('scope'), sc)) {
      // スプレッドシートのチェックが外れていた（2026-11-20 梅木さん「スプレッドシートの権限がありません」）。この鍵は取っておかず、送らない
      try { localStorage.removeItem(keyOf(mail, sc)); } catch (e) { }
      say(sc === 'cal' ? 'カレンダーの許可にチェックが入っていませんでした' : sc === 'meet' ? 'Meetを作る許可にチェックが入っていませんでした' : 'スプレッドシートの許可にチェックが入っていませんでした', '下のボタンでGoogleの画面をもう一度開き、' + (sc === 'cal' ? '「Google カレンダー」' : sc === 'meet' ? '「Google Meet」' : '「Google スプレッドシート」') + 'の行にチェックを入れて「続行」を押してください（まだ書いていません）', true);
      $('b').textContent = 'もう一度Googleへ'; $('b').style.display = ''; $('b').onclick = () => toGoogle(tk, mail, true, sc);
    }
    else {
      try { localStorage.setItem(keyOf(mail, sc), JSON.stringify({ t: h.get('access_token'), exp: Date.now() + (Number(h.get('expires_in')) || 3600) * 1000 })); } catch (e) { }
      send(tk, h.get('access_token'));
    }
  } else if (h.get('tk')) {
    // アプリから開かれた：1時間以内の鍵があれば使い、なければGoogleの許可へ
    const tk = h.get('tk'), mail = String(h.get('hint') || '').toLowerCase(), sc = SCOPES[h.get('sc') || ''] ? h.get('sc') || '' : '';
    if (h.get('keep') === '1' && !sc) { toGoogle(tk, mail, false, '', false, true); } else { // アプリが「まだ鍵を覚えていない」と言ったときは、長く使える鍵をもらう
    let c = null; try { c = JSON.parse(localStorage.getItem(keyOf(mail, sc)) || 'null'); } catch (e) { }
    // 取っておいた鍵は、まだ使えるか・スプレッドシートの許可があるかを確かめてから使う（足りなければ捨てて、Googleの許可へ）
    if (c && c.t && c.exp - Date.now() > 2 * 60000) fetch('https://oauth2.googleapis.com/tokeninfo?access_token=' + encodeURIComponent(c.t))
      .then(r => r.ok ? r.json() : null).then(j => { if (j && String(j.email || '').toLowerCase() === mail && hasSheets(j.scope, sc)) send(tk, c.t); else { try { localStorage.removeItem(keyOf(mail, sc)); } catch (e) { } toGoogle(tk, mail, !!j, sc, !j); } })
      .catch(() => toGoogle(tk, mail, false, sc, true));
    else toGoogle(tk, mail, false, sc, true);
    }
  } else { say('このページは、SoundWich APP から開いたときに使います', ''); done(); }
</script>
</body>
</html>
