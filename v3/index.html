<title>SoundWich APP Ver3</title>
<style>
  html,body{overscroll-behavior-x:none;margin:0;height:100%;background:#1c1c1e;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden}
  #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;display:block;background:#1c1c1e}
  /* 2画面（2026-11-21 天田さん「右半分に開いて2画面で見たい」）：左が今のアプリ、右がもう1つのアプリ（一覧なし・その画面だけ）。境目はドラッグで動かす */
  body.split #app{right:auto;width:var(--sl,55%)}
  #app2{position:fixed;top:env(safe-area-inset-top);bottom:0;right:0;left:calc(var(--sl,55%) + 6px);width:calc(100% - var(--sl,55%) - 6px);height:calc(100% - env(safe-area-inset-top));border:0;display:block;background:#1c1c1e}
  #splitbar{position:fixed;top:0;bottom:0;left:var(--sl,55%);width:6px;background:#3a3a3c;cursor:col-resize;z-index:5}
  #splitbar:hover,#splitbar.on{background:#0a84ff}
  body.splitdrag iframe{pointer-events:none}
  /* 右を閉じるボタンは、アプリの中に置くと画面のボタンに重なるので、境目の上（アプリの外）に置く */
  #splitx{position:fixed;top:50%;left:calc(var(--sl,55%) - 9px);width:24px;height:24px;margin-top:-12px;border-radius:50%;background:#3a3a3c;color:#f2f2f7;border:2px solid #1c1c1e;font-size:14px;line-height:20px;text-align:center;cursor:pointer;z-index:6;box-sizing:border-box}
  #splitx:hover{background:#0a84ff}
  /* 入口ページ自体は文字として選べないようにする（2026-11-21 天田さん：真ん中の×から文字選択のドラッグをしたら、右側が選択の色で覆われて解除しにくかった）。入力欄だけは選べる */
  html,body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
  #splitx,#splitbar{-webkit-user-drag:none}
  #gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px}
  #gate.on{display:flex}
  #inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px}
  #inv.on{display:flex}
  .box button[disabled]{opacity:.5}
  .box .tip{font-size:12px;color:#8e8e93;margin:14px 0 0;line-height:1.6}
  .box{width:min(320px,100%);text-align:center;animation:in .35s ease}
  .box img{width:72px;height:72px;border-radius:16px;margin-bottom:18px}
  .box h1{font-size:17px;font-weight:600;margin:0 0 6px}
  .box p{font-size:13px;color:#8e8e93;margin:0 0 20px;line-height:1.6}
  .box input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;background:#2c2c2e;color:#f2f2f7;border:0;border-radius:10px;padding:12px 14px;outline:none;text-align:center;letter-spacing:.04em}
  .box button{margin-top:12px;width:100%;font:inherit;font-size:16px;font-weight:600;background:#0a84ff;color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
  .box .err{color:#ff453a;min-height:18px;margin:10px 0 0;font-size:13px}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* 起動画面（2026-11-16 天田さん：候補A10「組み上がる」＋B2の by RĀHU の出方）。アプリが最初の画面を描いた瞬間（swapp:ready）に即消す。フェードも最低表示時間もなし */
  #sp{position:fixed;inset:0;z-index:5;background:#1c1c1e;display:flex;align-items:center;justify-content:center}
  #sp svg{width:64px;height:64px;display:block;overflow:visible;animation:sp-br 1.8s ease-in-out .7s infinite}
  #sp .p{transform-box:fill-box;transform-origin:0 50%}
  #sp .tri{animation:sp-in .25s both}
  #sp .b1{animation:sp-sl .32s cubic-bezier(.2,.8,.2,1) .06s both}
  #sp .b2{animation:sp-sl .32s cubic-bezier(.2,.8,.2,1) .12s both}
  #sp .b3{animation:sp-sl .32s cubic-bezier(.2,.8,.2,1) .18s both}
  #sp .wd{animation:sp-in .25s .24s both}
  #sp .ul{animation:sp-gr .3s cubic-bezier(.2,.8,.2,1) .3s both}
  #sp .by{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:7px;color:#8e8e93;font-size:12px;letter-spacing:.06em;animation:sp-up .5s cubic-bezier(.2,.8,.2,1) .35s both}

  const S = { get(k) { try { return localStorage.getItem('swapp.' + k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem('swapp.' + k, v) : localStorage.removeItem('swapp.' + k); } catch (e) { } } };
  (() => { /* 起動画面：今していることの一言を0.3秒ずつ進める・今日の一言（前回アプリが教えてくれた今日の現場の数）（2026-11-26） */
    const st = document.getElementById('spSt'), words = ['つないでいます', '案件を読み込み中', '並べています', 'もうすぐです'];
    let k = 0; const tick = () => { if (!document.getElementById('sp') || k >= words.length - 1) return; k++; st.innerHTML = '<span>' + words[k] + '</span>'; setTimeout(tick, k < 3 ? 300 : 900); }; setTimeout(tick, 300);
    const d = new Date(), ymd = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    let n = null; try { const t = JSON.parse(S.get('today') || 'null'); if (t && t.d === ymd) n = t.n; } catch (e) { }
    document.getElementById('spTd').innerHTML = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'[d.getDay()] + '）' + (n === null ? '' : '<small>' + (n ? '今日の現場 ' + n + '件' : '今日の現場はありません') + '</small>');
  })();
  // リンクの # のあとに合言葉が付いていたら覚える。ホーム画面に追加したアプリはSafariと保存場所が別なので、アドレスの # は消さずに残す（ホーム画面のアイコンに合言葉ごと入る）
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) S.set('k', h.get('k'));
  let dev = S.get('d'); if (!dev) { dev = Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 14); S.set('d', dev); }
  function open() {
    const k = S.get('k'); if (!k) return gate('');
    const q = new URLSearchParams(location.search), u = new URL(EXEC);
    u.searchParams.set('k', k); u.searchParams.set('ui', '3'); u.searchParams.set('d', dev); u.searchParams.set('ua', devName()); if (q.get('id')) u.searchParams.set('id', q.get('id')); if (/^[a-z]{2,10}$/.test(q.get('solo') || '')) u.searchParams.set('solo', q.get('solo')); /* 別ウインドウの2画面（2026-11-26） */
    let f = document.getElementById('app');
    if (!f) { f = document.createElement('iframe'); f.id = 'app'; f.title = 'SoundWich APP'; f.allow = 'clipboard-read; clipboard-write'; f.addEventListener('load', () => setTimeout(spOff, 15000)); document.body.appendChild(f); }
    f.src = u.toString();
    document.getElementById('gate').classList.remove('on');
    S.set('split', ''); /* 2画面は別ウインドウになったので、前の右半分は開き直さない（2026-11-26） */
  }
  // ===== 2画面（2026-11-21）：アプリから 'swapp:split:画面' が来たら右半分にその画面だけのアプリを開く。'swapp:unsplit' で閉じる。開いていた画面と幅は覚える
  const SPLIT_MIN = 1000;
  // 2026-11-26 天田さん「2画面の時は別ウインドウのほうがいい」→「別ウインドウにする」：右半分の枠ではなく、入口ページを別ウインドウで開く（Googleの帯を出さないため入口ページごと開く）
  function splitOpen(v) {
    let id = ''; const cm = String(v).match(/^([a-z]{2,10}):([A-Za-z0-9_-]{1,40})$/); if (cm) { v = cm[1]; id = cm[2]; }
    if (!/^[a-z]{2,10}$/.test(v)) return;
    const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('solo', v); if (id) u.searchParams.set('id', id);
    const w = Math.round(Math.min(screen.availWidth * 0.5, 1100)), h = Math.round(screen.availHeight * 0.9);
    const win = window.open(u.toString(), 'swapp_split', 'popup,width=' + w + ',height=' + h + ',left=' + Math.round(screen.availWidth - w) + ',top=0');
    if (win) { try { win.focus(); } catch (e) { } return; }
    splitOpenPane(v + (id ? ':' + id : '')); /* 別ウインドウが止められたときだけ、前の右半分で開く */
  }
  function splitOpenPane(v) {
    let id = ''; const cm = String(v).match(/^([a-z]{2,10}):([A-Za-z0-9_-]{1,40})$/); if (cm) { v = cm[1]; id = cm[2]; }
    if (!/^[a-z]{2,10}$/.test(v) || window.innerWidth < SPLIT_MIN) return;
    const a = document.getElementById('app'); if (!a || !a.src) return;
    let f = document.getElementById('app2');
    if (f && f.dataset.v === v && !id) { splitClose(); return; } /* 同じ画面をもう一度選んだら閉じる */
    const u = new URL(a.src); u.searchParams.set('solo', v); u.searchParams.delete('id'); if (id) u.searchParams.set('id', id);
    if (!f) { f = document.createElement('iframe'); f.id = 'app2'; f.title = 'SoundWich APP（右）'; f.allow = 'clipboard-read; clipboard-write'; document.body.appendChild(f); }
    f.dataset.v = v; f.src = u.toString();
    let b = document.getElementById('splitbar');
    if (!b) { b = document.createElement('div'); b.id = 'splitbar'; b.title = 'ドラッグで幅を変える'; document.body.appendChild(b); splitDrag(b); }
    if (!document.getElementById('splitx')) { const x = document.createElement('div'); x.id = 'splitx'; x.title = '右を閉じて1画面に戻す'; x.textContent = '×'; x.onclick = splitClose; x.onmousedown = e => e.preventDefault(); document.body.appendChild(x); }
    const r = Number(S.get('splitr')); if (r >= 25 && r <= 75) document.documentElement.style.setProperty('--sl', r + '%');
    document.body.classList.add('split'); S.set('split', v);
  }
  // もし入口ページに選択が残っても、アプリの中をクリックしたら外す（アプリの枠に移ると入口ページから見て blur になる）
  window.addEventListener('blur', () => { try { const g = window.getSelection(); if (g && g.rangeCount) g.removeAllRanges(); } catch (e) { } });
  function splitClose() {
    ['app2', 'splitbar', 'splitx'].forEach(id => { const x = document.getElementById(id); if (x) x.remove(); });
    document.body.classList.remove('split'); S.set('split', '');
  }
  function splitDrag(b) {
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); b.classList.add('on'); document.body.classList.add('splitdrag'); b.setPointerCapture && b.setPointerCapture(e.pointerId);
      const mv = ev => { const r = Math.max(25, Math.min(75, ev.clientX / window.innerWidth * 100)); document.documentElement.style.setProperty('--sl', r.toFixed(1) + '%'); S.set('splitr', r.toFixed(1)); };
      const up = () => { b.classList.remove('on'); document.body.classList.remove('splitdrag'); b.removeEventListener('pointermove', mv); b.removeEventListener('pointerup', up); b.removeEventListener('pointercancel', up); };
      b.addEventListener('pointermove', mv); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    });
  }
  window.addEventListener('resize', () => { if (window.innerWidth < SPLIT_MIN && document.getElementById('app2')) { document.getElementById('app2').remove(); ['splitbar', 'splitx'].forEach(id => { const b = document.getElementById(id); if (b) b.remove(); }); document.body.classList.remove('split'); } });
  // 新しい端末の知らせに出す、端末のおおまかな種類（機種名までは分からない）
  function devName() {
    const a = navigator.userAgent, t = navigator.maxTouchPoints > 1;
    const os = /iPhone/.test(a) ? 'iPhone' : /iPad/.test(a) || (/Macintosh/.test(a) && t) ? 'iPad' : /Android/.test(a) ? 'Android' : /Macintosh/.test(a) ? 'Mac' : /Windows/.test(a) ? 'Windows' : 'その他';
    const br = /CriOS|Chrome/.test(a) ? 'Chrome' : /Firefox|FxiOS/.test(a) ? 'Firefox' : /Safari/.test(a) ? 'Safari' : '';
    const home = (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? '・ホーム画面' : '';
    return os + (br ? '・' + br : '') + home;
  }
  // 起動画面を消す。アプリから合図が来たとき・合言葉の画面を出すとき。合図が来ない古い版でも閉じ込めないよう、枠の読み込みから15秒で消す
  function spOff() { const s = document.getElementById('sp'), b = document.getElementById('spbar'); if (b) { b.classList.add('done'); setTimeout(() => b.remove(), 450); } if (s && !s.classList.contains('out')) { s.classList.add('out'); setTimeout(() => s.remove(), 300); } } /* 2026-11-26：線を最後まで伸ばし、アイコンが大きくなりながら消える */
  function gate(msg) {
    spOff();
    const f = document.getElementById('app'); if (f) f.remove();
    document.getElementById('err').textContent = msg; document.getElementById('gate').classList.add('on');
    setTimeout(() => document.getElementById('k').focus(), 50);
  }
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); const v = document.getElementById('k').value.trim(); if (!v) return; S.set('k', v); document.getElementById('k').value = ''; open(); });
  // 知らせはアプリ（Googleの画面）から来たものだけ受け付ける。ほかのページからの「合言葉が違う」で、覚えた合言葉を消されないように（2026-11-16 バグチェック）
  const fromApp = o => /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(String(o || ''));
  window.addEventListener('message', e => { if (!fromApp(e.origin)) return; try { SWOFF.onMsg(e); } catch (er) { } if (e.data === 'swapp:ready') spOff(); if (typeof e.data === 'string' && /^swapp:today:\d{4}-\d{2}-\d{2}:\d{1,3}$/.test(e.data)) { const m = e.data.split(':'); S.set('today', JSON.stringify({ d: m[2], n: Number(m[3]) })); } if (e.data === 'swapp:reload') { location.reload(); return; } /* 2026-11-20 直した知らせの「更新する」 */ if (e.data === 'swapp:badkey') { S.set('k', ''); gate('合言葉が違います'); } if (typeof e.data === 'string' && e.data.indexOf('swapp:split:') === 0) splitOpen(e.data.slice(12)); if (e.data === 'swapp:unsplit') { if (new URLSearchParams(location.search).get('solo')) window.close(); else splitClose(); } });
  // 1回だけ使える招待リンク（2026-11-19）：リンクの # のあとの i＝招待の番号。「開く」を押したときだけサーバーに問い合わせ、合言葉をこの端末に覚える。
  // LINEのプレビューや、ページを開いただけでは使われない。LINEの中の画面で開くと、そこに合言葉が入ってSafariでは開けなくなるので、LINEの中ではボタンを出さない
  // （送るリンクには ?openExternalBrowser=1 を付け、LINEから押すとSafariなどで開くようにしている）
  function invite(t) {
    spOff();
    const el = document.getElementById('inv'), b = document.getElementById('invb'), er = document.getElementById('inverr');
    el.classList.add('on');
    if (/\bLine\//i.test(navigator.userAgent)) {
      document.getElementById('invp').innerHTML = 'LINEの中の画面では開けません。<br>右上（または右下）のメニューから<br>「Safariで開く」（Androidは「ブラウザで開く」）を押してください';
      b.style.display = 'none'; document.getElementById('invtip').style.display = 'none'; return;
    }
    b.addEventListener('click', () => {
      b.disabled = true; b.textContent = '開いています…'; er.textContent = '';
      // 問い合わせは、アプリの本体と同じく見えない枠で開き、結果を postMessage で受け取る（2026-11-19 iPhoneのSafariで fetch の答えが届かず赤い文字になったため）
      const u = new URL(EXEC); u.searchParams.set('inv2', t); u.searchParams.set('ua', devName()); u.searchParams.set('d', dev);
      const fr = document.createElement('iframe'); fr.style.display = 'none'; fr.title = '招待';
      let done = false;
      const onMsg = e => { if (!fromApp(e.origin) || !e.data || e.data.t !== 'swapp:inv') return; done = true; window.removeEventListener('message', onMsg); fr.remove(); got(e.data); };
      window.addEventListener('message', onMsg);
      setTimeout(() => { if (done) return; window.removeEventListener('message', onMsg); fr.remove(); er.textContent = '通信できませんでした（時間切れ）。電波のよい所で、もう一度押してください'; b.disabled = false; b.textContent = '開く'; }, 40000);
      fr.src = u.toString(); document.body.appendChild(fr);
      function got(j) {
        if (!j || !j.ok) { er.textContent = (j && j.msg) || '開けませんでした'; b.textContent = '開く'; b.disabled = false; return; }
        S.set('k', j.k);
        // アドレスの # を合言葉に入れ替える（ホーム画面に追加したとき、アイコンに合言葉が入るように。今までの渡し方と同じ）
        const q = new URLSearchParams(location.search); q.delete('openExternalBrowser');
        history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '') + '#k=' + encodeURIComponent(j.k));
        el.classList.remove('on'); open();
      }
    });
  }
  if (h.get('i')) invite(h.get('i')); else open();
  // 見るだけの控え（off.js。2026-11-20）：ネットがないときは、端末に取っておいた案件の要点を出す
  try { if (!h.get('i') && S.get('k')) SWOFF.start(); } catch (er) { }
</script>
