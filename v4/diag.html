<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>診断</title>
<style>body{background:#1c1c1e;color:#f2f2f7;font:13px/1.6 -apple-system,sans-serif;padding:16px}b{color:#6fd08c}i{color:#ff453a;font-style:normal}</style></head><body><div id="o"></div>
<script>
// 試し版（v4）の診断：値は出さず、あるかないか・段階だけを出す
const o=document.getElementById('o'),L=(t,ok)=>{const d=document.createElement('div');d.innerHTML=(ok===false?'<i>×</i> ':ok?'<b>○</b> ':'・ ')+t;o.appendChild(d);};
const g=k=>{try{return localStorage.getItem('swapp.'+k)||''}catch(e){return 'ERR'}};
(async()=>{
 L('UA: '+navigator.userAgent.slice(0,120));
 ['k','d','v4ak','v4who','v4build','v4bin','v4lag','v4boot'].forEach(k=>{const v=g(k);L('swapp.'+k+'：'+(v?(k==='v4build'||k==='v4bin'||k==='v4lag'||k==='v4who'?v:'あり（'+v.length+'字）'):'なし'),!!v);});
 L('DecompressionStream：'+(typeof DecompressionStream),typeof DecompressionStream==='function');
 L('crypto.subtle：'+(!!(window.crypto&&crypto.subtle)),!!(window.crypto&&crypto.subtle));
 try{const r=await navigator.serviceWorker.getRegistrations();L('SW登録：'+r.map(x=>x.scope).join(', '));}catch(e){L('SW：'+e,false);}
 try{const ks=await caches.keys();L('caches：'+ks.join(', '));const c=await caches.open('swapp-v4');const m=await c.match('app.bin');L('束の控え：'+(m?'あり':'なし'));}catch(e){L('caches：'+e,false);}
 try{const t=performance.now();const l=await (await fetch('latest.json?t='+Date.now(),{cache:'no-store'})).json();L('latest.json：'+l.b+'（'+Math.round(performance.now()-t)+'ms）',true);}catch(e){L('latest.json：'+e,false);}
 try{const t=await (await fetch('v4.js?t='+Date.now(),{cache:'no-store'})).text();L('v4.js：'+(t.includes('v4st')?'新しい版':'古い版'),t.includes('v4st'));}catch(e){L('v4.js：'+e,false);}
 // つなぎ（見えない窓）が答えるか
 const EXEC='https://script.google.com/macros/s/AKfycbxSB-wZdgOUeokFqoIKT4RjKyN3-roupbiJlbRINV0bdzMdXbmB8L8fuChSce2Jrvnd/exec';
 const t0=performance.now(); let got=false;
 window.addEventListener('message',e=>{const d=e.data;if(d&&d.t==='swapp:bridge'){got=true;L('つなぎ：答えた（'+Math.round(performance.now()-t0)+'ms）ok='+d.ok+(d.why?' 理由='+d.why:'')+' 一覧='+(d.boot&&d.boot.list?d.boot.list.length+'件':'なし')+' 送り元='+e.origin,d.ok);}});
 const f=document.createElement('iframe');f.style.display='none';f.src=EXEC+'?bridge=1&k='+encodeURIComponent(g('k'))+'&d='+encodeURIComponent(g('d'))+'&ua=diag';document.body.appendChild(f);
 L('つなぎを開きました（最大30秒待ちます）');
 setTimeout(()=>{if(!got)L('つなぎ：30秒たっても答えなし',false);},30000);
 const f2=document.createElement('iframe');f2.style.cssText='width:1px;height:1px;opacity:0;position:absolute';f2.src=EXEC+'?bridge=1&k='+encodeURIComponent(g('k'))+'&d='+encodeURIComponent(g('d'))+'&ua=diag2';document.body.appendChild(f2);
})();
</script></body></html>
