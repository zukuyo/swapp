<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>診断</title>
<style>body{background:#1c1c1e;color:#f2f2f7;font:13px/1.6 -apple-system,sans-serif;padding:16px}</style></head><body><div id="o"></div>
<script>
const o=document.getElementById('o'),L=t=>{const d=document.createElement('div');d.textContent=t;o.appendChild(d);};
const g=k=>{try{return localStorage.getItem('swapp.'+k)||''}catch(e){return 'ERR'}};
(async()=>{
 ['k','d','v4ak','v4who','v4build','v4bin','v4lag','v4cw'].forEach(k=>{const v=g(k);L(k+'：'+(v?(/build|bin|lag|who|cw/.test(k)?v:'あり'+v.length):'なし'));});
 L('v4boot：'+Math.round(g('v4boot').length/1024)+'KB');
 try{const c=await caches.open('swapp-v4');const m=await c.match('app.bin');L('束の控え：'+(m?'あり':'なし'));}catch(e){L('caches：'+e);}
 try{const l=await (await fetch('latest.json?t='+Date.now(),{cache:'no-store'})).json();L('latest：'+l.b);}catch(e){L('latest：'+e);}
 try{const r=await navigator.serviceWorker.getRegistrations();L('SW：'+r.length);}catch(e){}
})();
</script></body></html>
